<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사이버 두유</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 상단 바 -->
  <div class="topbar">
    <div class="rooms" id="rooms">
      <button class="room active" data-room="free">두유노두유</button>
      <button class="room" data-room="coding">두유노코딩</button>
      <button class="room" data-room="overtime">두유노야근</button>
      <button class="room" data-room="exam">두유노시험</button> 
    </div>
    <div class="status-area">
      <button class="mute" id="music" title="배경음악 켜기/끄기">🎵</button>
      <button class="mute" id="mute" title="효과음 켜기/끄기">🔊</button>
      <div class="status" id="status">
        <span class="dot"></span><span id="statusText">연결 중…</span>
      </div>
    </div>
  </div>

  <div class="scene" id="scene">
    <h1>🥛 사이버 두유</h1>

    <!-- 두유병 -->
    <div class="bottle" id="bottle">
      <div class="cap"></div>
      <div class="neck"></div>
      <div class="body">
        <div class="liquid" id="liquid">
          <span class="bubble b1"></span>
          <span class="bubble b2"></span>
          <span class="bubble b3"></span>
        </div>
        <div class="straw"></div>
        <div class="label" id="label">오리지널</div>
      </div>
    </div>

    <p class="hint" id="hint">두유병을 꾹 눌러 마셔보세요 · 배경을 탭하면 한마디 남길 수 있어요</p>
    <div class="counter" id="counter">오늘 0잔</div>

    <!-- 맛 선택 -->
    <div class="controls" id="controls">
      <button class="flavor active" data-color="#f7efda" data-name="오리지널">오리지널</button>
      <button class="flavor" data-color="#f5c4d2" data-name="딸기">딸기</button>
      <button class="flavor" data-color="#5b5560" data-name="흑임자">흑임자</button>
      <button class="flavor" data-color="#f1e09a" data-name="바나나">바나나</button>
    </div>

    <!-- 빠른 한마디 -->
    <div class="quick" id="quick">
      <button class="qbtn">큰일났다</button>
      <button class="qbtn">화이팅</button>
      <button class="qbtn">집에 가고 싶다</button>
      <button class="qbtn">두유 한 잔 🥛</button>
    </div>
  </div>

  <!-- bgm -->
  <audio id="bgm" loop src="bgm.mp3" loop preload="auto"></audio>

  <!--Supabase 라이브러리-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
