<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사이버 두유</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg1:    #e7ddc9;
      --bg2:    #d3c6ac;
      --liquid: #f7efda;
      --glass:  rgba(255,255,255,0.18);
      --line:   rgba(90,70,45,0.45);
      --text:   #5a4a36;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Gowun Dodum', sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
    }

    h1 {
      font-family: 'Gaegu', cursive;
      font-size: 40px;
      font-weight: normal;
    }

    /* ---------- 두유병 ---------- */
    .bottle {
      position: relative;
      width: 120px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      filter: drop-shadow(0 14px 18px rgba(90,70,45,0.25));
    }
    .cap {
      width: 56px;
      height: 26px;
      margin: 0 auto;
      background: #c9a36b;
      border-radius: 7px 7px 3px 3px;
    }
    .neck {
      width: 44px;
      height: 20px;
      margin: 0 auto;
      background: var(--glass);
      border: 2px solid var(--line);
      border-bottom: none;
    }
    .body {
      position: relative;
      width: 120px;
      height: 210px;
      background: var(--glass);
      border: 3px solid var(--line);
      border-radius: 10px 10px 22px 22px;
      overflow: hidden;
    }
    .liquid {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: var(--liquid);
      transition: height 0.12s ease;
    }
    .liquid::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: rgba(255,255,255,0.45);
    }
    .label {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-family: 'Gaegu', cursive;
      font-size: 18px;
      color: #5a4a36;
      background: rgba(255,255,255,0.7);
      padding: 4px 0;
      pointer-events: none;
    }

    .hint {
      font-size: 15px;
      opacity: 0.7;
      text-align: center;
      min-height: 22px;
    }

    /* ---------- 맛 버튼 ---------- */
    .controls { display: flex; gap: 10px; }
    .flavor {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: rgba(255,255,255,0.55);
      border: 2px solid transparent;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
    }
    .flavor.active {
      border-color: var(--text);
      background: rgba(255,255,255,0.95);
    }

    /* ---------- 떠다니는 메시지 ---------- */
    .msg {
      position: absolute;
      font-family: 'Gaegu', cursive;
      font-size: 18px;
      color: var(--text);
      background: rgba(255,255,255,0.8);
      padding: 6px 14px;
      border-radius: 16px;
      white-space: nowrap;
      pointer-events: none;
      animation: floatUp 4s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 0; transform: translate(-50%, 10px) scale(0.96); }
      15%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
    }

    .talk-input {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 16px;
      color: var(--text);
      background: rgba(255,255,255,0.95);
      border: 2px solid var(--text);
      border-radius: 14px;
      padding: 8px 14px;
      outline: none;
      width: 220px;
    }

    /* ---------- 연결 상태 배지 (오른쪽 위 작은 표시) ---------- */
    .status {
      position: fixed;
      top: 14px;
      right: 16px;
      font-size: 13px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #b0a48d;            /* 회색: 오프라인 */
    }
    .status.online .dot { background: #4caf50; }  /* 초록: 연결됨 */
  </style>
</head>

<body>
  <!-- 연결 상태 표시 -->
  <div class="status" id="status">
    <span class="dot"></span><span id="statusText">오프라인 (나 혼자)</span>
  </div>

  <div class="scene" id="scene">
    <h1>🥛 사이버 두유</h1>

    <div class="bottle" id="bottle">
      <div class="cap"></div>
      <div class="neck"></div>
      <div class="body">
        <div class="liquid" id="liquid"></div>
        <div class="label" id="label">오리지널</div>
      </div>
    </div>

    <p class="hint" id="hint">두유병을 꾹 눌러 마셔보세요 · 배경을 탭하면 한마디 남길 수 있어요</p>

    <div class="controls" id="controls">
      <button class="flavor active" data-color="#f7efda" data-name="오리지널">오리지널</button>
      <button class="flavor" data-color="#f5c4d2" data-name="딸기">딸기</button>
      <button class="flavor" data-color="#5b5560" data-name="흑임자">흑임자</button>
      <button class="flavor" data-color="#f1e09a" data-name="바나나">바나나</button>
    </div>
  </div>

  <!--supabase-->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://qyofyiebadjraeaanqli.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_SGzts52JUOhYlqRu4W5kXw_MrR3lP3o';

    /* ============================================================ */

    // 1) 기본 요소들 찾기
    const scene      = document.getElementById('scene');
    const bottle     = document.getElementById('bottle');
    const liquid     = document.getElementById('liquid');
    const label      = document.getElementById('label');
    const hint       = document.getElementById('hint');
    const controls   = document.getElementById('controls');
    const statusBox  = document.getElementById('status');
    const statusText = document.getElementById('statusText');

    /* ---------- 기능 1: 두유 마시기 ---------- */
    let level = 100;
    let timer = null;

    bottle.addEventListener('pointerdown', function () {
      if (level <= 0) {
        refill();
      } else {
        timer = setInterval(drink, 80);
      }
    });
    window.addEventListener('pointerup', function () {
      clearInterval(timer);
      timer = null;
    });
    function drink() {
      level = level - 4;
      if (level <= 0) {
        level = 0;
        clearInterval(timer);
        hint.textContent = '다 마셨다! 다시 누르면 새 두유 🥛';
      }
      liquid.style.height = level + '%';
    }
    function refill() {
      level = 100;
      liquid.style.height = '100%';
      hint.textContent = '두유병을 꾹 눌러 마셔보세요 · 배경을 탭하면 한마디 남길 수 있어요';
    }

    /* ---------- 기능 3: 맛(색) 바꾸기 ---------- */
    controls.addEventListener('click', function (e) {
      const btn = e.target.closest('.flavor');
      if (!btn) return;
      document.documentElement.style.setProperty('--liquid', btn.dataset.color);
      label.textContent = btn.dataset.name;
      document.querySelector('.flavor.active').classList.remove('active');
      btn.classList.add('active');
    });

    /* ============================================================
       기능 2 + 실시간: Supabase 연결
       ============================================================ */

    let channel = null;   // 채팅 채널. 연결 안 되면 null 로 둠 (= 오프라인)

    // 키가 아직 안 채워졌는지 확인 (한글 안내문이 그대로면 미설정 상태)
    const isConfigured = !SUPABASE_URL.includes('여기에') && !SUPABASE_KEY.includes('여기에');

    if (isConfigured) {
      // 2) Supabase 클라이언트 만들기
      const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      // 3) 'cyber-soymilk-room' 이라는 방(채널)에 접속.
      //    같은 방에 접속한 사람끼리 메시지를 주고받습니다.
      channel = supabase.channel('cyber-soymilk-room');

      // 4) 다른 사람이 보낸 'chat' 메시지를 받으면 → 화면에 떠올리기
      channel.on('broadcast', { event: 'chat' }, function (payload) {
        const text = (payload.payload.text || '').slice(0, 60); // 너무 길면 자르기
        if (text) showMessageRandom(text);   // 받은 메시지는 화면 아무 곳에 띄움
      });

      // 5) 실제 접속 시작. 상태가 바뀌면 오른쪽 위 배지를 갱신
      channel.subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          statusBox.classList.add('online');
          statusText.textContent = '실시간 연결됨';
        } else {
          statusBox.classList.remove('online');
          statusText.textContent = '연결 끊김';
        }
      });
    }
    // 키가 없으면 위 블록을 통째로 건너뛰고 오프라인으로 동작합니다.

    // 다른 사람에게 메시지 보내기 (연결돼 있을 때만)
    function sendChat(text) {
      if (!channel) return;   // 오프라인이면 보내지 않음
      channel.send({
        type: 'broadcast',
        event: 'chat',
        payload: { text: text }
      });
    }

    /* ---------- 배경 탭해서 한마디 (기능 2) ---------- */
    scene.addEventListener('click', function (e) {
      if (e.target.closest('#bottle')) return;
      if (e.target.closest('#controls')) return;
      if (e.target.closest('.talk-input')) return;
      openTalkInput(e.clientX, e.clientY);
    });

    function openTalkInput(x, y) {
      const old = document.querySelector('.talk-input');
      if (old) old.remove();

      const input = document.createElement('input');
      input.className = 'talk-input';
      input.placeholder = '한마디 적고 Enter';
      input.maxLength = 60;
      input.style.left = x + 'px';
      input.style.top  = y + 'px';
      scene.appendChild(input);
      input.focus();

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          const text = input.value.trim();
          if (text) {
            showMessage(text, x, y);   // 내 화면에 바로 띄우고
            sendChat(text);            // 다른 사람들에게도 전송
          }
          input.remove();
        } else if (e.key === 'Escape') {
          input.remove();
        }
      });
      input.addEventListener('blur', function () { input.remove(); });
    }

    // 메시지를 특정 위치(x, y)에 띄우기
    function showMessage(text, x, y) {
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.textContent = text;
      msg.style.left = x + 'px';
      msg.style.top  = y + 'px';
      scene.appendChild(msg);
      msg.addEventListener('animationend', function () { msg.remove(); });
    }

    // 받은 메시지는 위치를 모르니 화면 아무 곳(아래쪽)에 무작위로 띄우기
    function showMessageRandom(text) {
      const x = 80 + Math.random() * (window.innerWidth - 160);
      const y = window.innerHeight * 0.55 + Math.random() * (window.innerHeight * 0.25);
      showMessage(text, x, y);
    }
  </script>
</body>
</html>
